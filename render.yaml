services:
  - type: web
    name: contra6-scoring-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: COPILOT_SKIP_CLI_DOWNLOAD
        value: "1"
      # Combo D: single-model idle baseline (~637MB local) fits a 2GB plan.
      # Revert to dual-model with SIMILARITY_MODEL=qwen (+ larger plan if needed).
      - key: BASE_EMBEDDING_DTYPE
        value: "fp16"
      - key: SIMILARITY_MODEL
        value: "mpnet-only"
